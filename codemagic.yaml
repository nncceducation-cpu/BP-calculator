workflows:
  ios-capacitor:
    name: Neonatal BP Centiles iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: AppStoreConnectKey
    environment:
      vars:
        BUNDLE_ID: "ca.nncceducation.neonatalbp"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify calculator and prepare web assets
        script: |
          npm install
          npm test
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js data.js privacy.html www/
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp assets/app-icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          printf '%s' '{"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
      - name: Set version and build number
        script: |
          cd ios/App
          agvtool new-marketing-version 1.0
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up code signing
        script: |
          keychain initialize
          openssl genrsa -out /tmp/dist_cert_key.pem 2048
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/dist_cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-capacitor:
    name: Neonatal BP Centiles Android
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      android_signing:
        - hie_upload_keystore
      vars:
        PACKAGE_NAME: "ca.nncceducation.neonatalbp"
      node: 20
      java: 21
    scripts:
      - name: Verify calculator and prepare web assets
        script: |
          npm install
          npm test
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js data.js privacy.html www/
      - name: Generate Android project
        script: |
          npx cap add android
          npx cap sync android
          python3 sign-patch.py
          npx capacitor-assets generate --android --assetPath assets
      - name: Set version
        script: |
          cd android
          sed -i.bak "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" app/build.gradle
          sed -i.bak 's/versionName "[^"]*"/versionName "1.0"/' app/build.gradle
      - name: Build signed release bundle
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
