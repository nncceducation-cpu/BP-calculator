workflows:  ios-capacitor:    name: Neonatal BP Centiles iOS    instance_type: mac_mini_m2    max_build_duration: 60    integrations:      app_store_connect: AppStoreConnectKey    environment:      vars:        BUNDLE_ID: "ca.nncceducation.neonatalbp"        XCODE_WORKSPACE: "ios/App/App.xcworkspace"        XCODE_SCHEME: "App"      node: 20      xcode: latest      cocoapods: default    scripts:      - name: Verify calculator and prepare web assets        script: |          npm install          npm test          rm -rf www          mkdir -p www          cp index.html styles.css app.js data.js additional-data.js contemporary-data.js contemporary.js privacy.html www/          for asset in index.html styles.css app.js data.js additional-data.js contemporary-data.js contemporary.js privacy.html; do            test -s "www/$asset"          done      - name: Generate iOS project        script: |          npx cap add ios          npx cap sync ios          rm -rf ios/App/App/Assets.xcassets/AppIcon.appiconset          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset          cp assets/app-icon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png          printf '%s' '{"images":[{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json      - name: Set version and build number        script: |          cd ios/App          agvtool new-marketing-version 1.1          agvtool new-version -all "$BUILD_NUMBER"      - name: Set up code signing        script: |          keychain initialize          openssl genrsa -out /tmp/dist_cert_key.pem 2048          app-store-connect fetch-signing-files "$BUNDLE_ID" \            --type IOS_APP_STORE \            --certificate-key=@file:/tmp/dist_cert_key.pem \            --create          keychain add-certificates          xcode-project use-profiles --project ios/App/App.xcodeproj      - name: Build signed IPA        script: |          xcode-project build-ipa \            --workspace "$XCODE_WORKSPACE" \            --scheme "$XCODE_SCHEME"    artifacts:      - build/ios/ipa/*.ipa      - /tmp/xcodebuild_logs/*.log    publishing:      app_store_connect:        auth: integration        submit_to_testflight: true
